<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - 云上OPC社区</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed',
                        'primary-dark': '#6d28d9',
                        'primary-light': '#a78bfa',
                        secondary: '#1e1b4b',
                        accent: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        .gradient-bg { background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55)), url('登录页背景.jpeg') center center / cover no-repeat; }
        .tab-active { border-bottom: 2px solid #7c3aed; color: #7c3aed; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #6b7280; }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2">
                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center overflow-hidden">
                    <img src="logo.png" alt="云上OPC" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col leading-tight items-start">
                    <span class="text-base font-bold text-white">粤港澳大湾区大数据中心</span>
                    <span class="text-sm font-semibold text-white/90">云上AI OPC社区</span>
                </div>
            </a>
        </div>

        <!-- 登录/注册卡片 -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- 一级标签页：个人登录 | 租户登录 | 注册 -->
            <div class="flex border-b border-gray-200">
                <button id="indTab" class="flex-1 py-4 text-center font-medium tab-active" onclick="switchMainTab('individual')">个人登录</button>
                <button id="tenantTab" class="flex-1 py-4 text-center font-medium tab-inactive" onclick="switchMainTab('tenant')">租户登录</button>
                <button id="registerTab" class="flex-1 py-4 text-center font-medium tab-inactive" onclick="switchMainTab('register')">注册</button>
            </div>

            <div class="p-8">
                <!-- ========== 个人登录面板 ========== -->
                <div id="individualLogin">
                    <div class="flex space-x-4 mb-6">
                        <button id="indPwdBtn" class="flex-1 py-2 px-4 rounded-lg bg-primary text-white text-sm font-medium" onclick="switchIndMethod('password')">密码登录</button>
                        <button id="indCodeBtn" class="flex-1 py-2 px-4 rounded-lg bg-gray-100 text-gray-600 text-sm font-medium" onclick="switchIndMethod('code')">验证码登录</button>
                    </div>
                    <div id="indPasswordLogin">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">用户名/手机号</label>
                                <input type="text" id="indPwdUsername" placeholder="请输入用户名或手机号"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                                <input type="password" id="indPwdPassword" placeholder="请输入密码"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div class="flex items-center justify-between">
                                <a href="#" class="text-sm text-primary hover:text-primary-dark">忘记密码？</a>
                            </div>
                        </div>
                    </div>
                    <div id="indCodeLogin" class="hidden">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">手机号</label>
                                <input type="tel" id="indCodePhone" placeholder="请输入手机号"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">验证码</label>
                                <div class="flex space-x-3">
                                    <input type="text" id="indCodeCode" placeholder="请输入验证码"
                                        class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <button id="indSendCodeBtn" onclick="sendCode('individual')" class="px-4 py-3 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition whitespace-nowrap">
                                        获取验证码
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button onclick="handleLogin('individual')" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-primary-dark transition mt-6">
                        登录
                    </button>
                </div>

                <!-- ========== 租户登录面板 ========== -->
                <div id="tenantLogin" class="hidden">
                    <div class="flex space-x-4 mb-6">
                        <button id="tenantPwdBtn" class="flex-1 py-2 px-4 rounded-lg bg-primary text-white text-sm font-medium" onclick="switchTenantMethod('password')">密码登录</button>
                        <button id="tenantCodeBtn" class="flex-1 py-2 px-4 rounded-lg bg-gray-100 text-gray-600 text-sm font-medium" onclick="switchTenantMethod('code')">验证码登录</button>
                    </div>
                    <div id="tenantPasswordLogin">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">租户名称</label>
                                <input type="text" id="tenantPwdName" placeholder="请输入租户名称"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                                <input type="password" id="tenantPwdPassword" placeholder="请输入密码"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div class="flex items-center justify-between">
                                <a href="#" class="text-sm text-primary hover:text-primary-dark">忘记密码？</a>
                            </div>
                        </div>
                    </div>
                    <div id="tenantCodeLogin" class="hidden">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">管理员手机号</label>
                                <input type="tel" id="tenantCodePhone" placeholder="请输入管理员手机号"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">验证码</label>
                                <div class="flex space-x-3">
                                    <input type="text" id="tenantCodeCode" placeholder="请输入验证码"
                                        class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                                    <button id="tenantSendCodeBtn" onclick="sendCode('tenant')" class="px-4 py-3 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition whitespace-nowrap">
                                        获取验证码
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button onclick="handleLogin('tenant')" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-primary-dark transition mt-6">
                        登录
                    </button>
                </div>

                <!-- ========== 注册面板 ========== -->
                <div id="registerForm" class="hidden">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">姓名</label>
                            <input type="text" id="registerName" placeholder="请输入真实姓名" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">单位（可选）</label>
                            <input type="text" id="registerCompany" placeholder="请输入单位名称" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                            <input type="text" id="registerUsername" placeholder="设置用户名" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                            <input type="password" id="registerPassword" placeholder="设置密码（至少8位，含字母、数字、特殊字符）" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            <p class="text-xs text-gray-500 mt-1">密码需至少8位，包含字母、数字、特殊字符</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">确认密码</label>
                            <input type="password" id="registerConfirmPassword" placeholder="再次输入密码" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">手机号</label>
                            <input type="tel" id="registerPhone" placeholder="请输入手机号" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">短信验证码</label>
                            <div class="flex space-x-3">
                                <input type="text" id="registerPhoneCode" placeholder="请输入验证码" 
                                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                                <button id="sendRegisterCodeBtn" onclick="sendCode('register')" class="px-4 py-3 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition whitespace-nowrap">
                                    获取验证码
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="flex items-start">
                            <input type="checkbox" id="agreeTerms" class="rounded border-gray-300 text-primary focus:ring-primary mt-1">
                            <span class="ml-2 text-sm text-gray-600">
                                我已阅读并同意<a href="#" class="text-primary hover:text-primary-dark">《用户协议》</a>和<a href="#" class="text-primary hover:text-primary-dark">《隐私政策》</a>
                            </span>
                        </label>
                    </div>

                    <button onclick="handleRegister()" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-primary-dark transition mt-6">
                        注册
                    </button>
                </div>
            </div>
        </div>

        <!-- 返回首页 -->
        <div class="text-center mt-6">
            <a href="index.html" class="text-white hover:text-gray-200 transition">
                <i class="fas fa-arrow-left mr-2"></i>返回首页
            </a>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let currentMainTab = 'individual';
        let indLoginMethod = 'password';
        let tenantLoginMethod = 'password';
        let countdown = 0;

        const MAIN_TABS = ['indTab','tenantTab','registerTab'];
        const MAIN_PANELS = ['individualLogin','tenantLogin','registerForm'];

        function switchMainTab(tab) {
            currentMainTab = tab;
            MAIN_TABS.forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('tab-active'); el.classList.add('tab-inactive');
            });
            const activeTabId = tab === 'individual' ? 'indTab' : tab === 'tenant' ? 'tenantTab' : 'registerTab';
            const activeTabEl = document.getElementById(activeTabId);
            activeTabEl.classList.remove('tab-inactive'); activeTabEl.classList.add('tab-active');

            MAIN_PANELS.forEach(id => document.getElementById(id).classList.add('hidden'));
            const panelId = tab === 'individual' ? 'individualLogin' : tab === 'tenant' ? 'tenantLogin' : 'registerForm';
            document.getElementById(panelId).classList.remove('hidden');
        }

        function switchIndMethod(method) {
            indLoginMethod = method;
            const pwdBtn = document.getElementById('indPwdBtn');
            const codeBtn = document.getElementById('indCodeBtn');
            if (method === 'password') {
                pwdBtn.className = 'flex-1 py-2 px-4 rounded-lg bg-primary text-white text-sm font-medium';
                codeBtn.className = 'flex-1 py-2 px-4 rounded-lg bg-gray-100 text-gray-600 text-sm font-medium';
                document.getElementById('indPasswordLogin').classList.remove('hidden');
                document.getElementById('indCodeLogin').classList.add('hidden');
            } else {
                codeBtn.className = 'flex-1 py-2 px-4 rounded-lg bg-primary text-white text-sm font-medium';
                pwdBtn.className = 'flex-1 py-2 px-4 rounded-lg bg-gray-100 text-gray-600 text-sm font-medium';
                document.getElementById('indCodeLogin').classList.remove('hidden');
                document.getElementById('indPasswordLogin').classList.add('hidden');
            }
        }

        function switchTenantMethod(method) {
            tenantLoginMethod = method;
            const pwdBtn = document.getElementById('tenantPwdBtn');
            const codeBtn = document.getElementById('tenantCodeBtn');
            if (method === 'password') {
                pwdBtn.className = 'flex-1 py-2 px-4 rounded-lg bg-primary text-white text-sm font-medium';
                codeBtn.className = 'flex-1 py-2 px-4 rounded-lg bg-gray-100 text-gray-600 text-sm font-medium';
                document.getElementById('tenantPasswordLogin').classList.remove('hidden');
                document.getElementById('tenantCodeLogin').classList.add('hidden');
            } else {
                codeBtn.className = 'flex-1 py-2 px-4 rounded-lg bg-primary text-white text-sm font-medium';
                pwdBtn.className = 'flex-1 py-2 px-4 rounded-lg bg-gray-100 text-gray-600 text-sm font-medium';
                document.getElementById('tenantCodeLogin').classList.remove('hidden');
                document.getElementById('tenantPasswordLogin').classList.add('hidden');
            }
        }

        function getSendCodeBtnId(type) {
            if (type === 'individual') return 'indSendCodeBtn';
            if (type === 'tenant') return 'tenantSendCodeBtn';
            return 'sendRegisterCodeBtn';
        }

        function getPhoneInput(type) {
            if (type === 'individual') return document.getElementById('indCodePhone');
            if (type === 'tenant') return document.getElementById('tenantCodePhone');
            return document.getElementById('registerPhone');
        }

        function sendCode(type) {
            if (countdown > 0) return;
            const phoneEl = getPhoneInput(type);
            if (!phoneEl || !phoneEl.value) {
                showToast('请输入手机号', 'error');
                return;
            }
            showToast('验证码已发送');
            countdown = 60;
            updateCountdown(type);
        }

        function updateCountdown(type) {
            const btnId = getSendCodeBtnId(type);
            const btn = document.getElementById(btnId);
            if (countdown > 0) {
                btn.textContent = `${countdown}秒后重发`;
                btn.disabled = true;
                countdown--;
                setTimeout(() => updateCountdown(type), 1000);
            } else {
                btn.textContent = '获取验证码';
                btn.disabled = false;
            }
        }

        function handleLogin(loginType) {
            if (loginType === 'individual') {
                if (indLoginMethod === 'password') {
                    const v = document.getElementById('indPwdUsername').value;
                    if (!v) { showToast('请输入用户名或手机号', 'error'); return; }
                } else {
                    const v = document.getElementById('indCodePhone').value;
                    if (!v) { showToast('请输入手机号', 'error'); return; }
                }
            } else {
                if (tenantLoginMethod === 'password') {
                    const v = document.getElementById('tenantPwdName').value;
                    if (!v) { showToast('请输入租户名称', 'error'); return; }
                } else {
                    const v = document.getElementById('tenantCodePhone').value;
                    if (!v) { showToast('请输入管理员手机号', 'error'); return; }
                }
            }

            localStorage.setItem('opc_token', 'mock_token_' + Date.now());
            const state = { isLoggedIn: true, loginType: loginType };
            try {
                const raw = localStorage.getItem('opc_app_state');
                if (raw) {
                    const existing = JSON.parse(raw);
                    Object.assign(existing, state);
                    localStorage.setItem('opc_app_state', JSON.stringify(existing));
                } else {
                    localStorage.setItem('opc_app_state', JSON.stringify(state));
                }
            } catch (e) {
                localStorage.setItem('opc_app_state', JSON.stringify(state));
            }

            showToast(loginType === 'tenant' ? '租户登录成功' : '登录成功');

            setTimeout(() => {
                try {
                    const raw = localStorage.getItem('opc_app_state');
                    if (raw) {
                        const st = JSON.parse(raw);
                        if (st.pendingAction && st.pendingAction.action) {
                            const pa = st.pendingAction;
                            localStorage.setItem('opc_app_state', JSON.stringify({ ...st, pendingAction: null }));
                            if (pa.callbackName && typeof window[pa.callbackName] === 'function') {
                                window[pa.callbackName](...pa.args);
                                return;
                            }
                            if (pa.targetUrl) {
                                window.location.href = pa.targetUrl;
                                return;
                            }
                            showToast(`正在进入${pa.action}`);
                            setTimeout(() => { window.location.href = 'services.html'; }, 800);
                            return;
                        }
                    }
                } catch (e) {}
                const referrer = document.referrer;
                if (referrer && !referrer.includes('login.html')) {
                    window.location.href = referrer;
                } else {
                    window.location.href = 'index.html';
                }
            }, 1200);
        }

        function handleRegister() {
            if (!document.getElementById('agreeTerms').checked) {
                showToast('请阅读并同意用户协议和隐私政策', 'error');
                return;
            }
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            if (password.length < 8) { showToast('密码至少8位', 'error'); return; }
            if (!/(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*])/.test(password)) {
                showToast('密码需包含字母、数字、特殊字符', 'error');
                return;
            }
            if (password !== confirmPassword) { showToast('两次输入的密码不一致', 'error'); return; }
            showToast('注册成功');
            setTimeout(() => { switchMainTab('individual'); }, 1500);
        }
    </script>
</body>
</html>
