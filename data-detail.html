<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据详情 - 云上OPC社区</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { light: '#9333ea', DEFAULT: '#7c3aed', dark: '#6d28d9' },
                        'primary-dark': '#6d28d9',
                        'primary-light': '#a78bfa',
                        secondary: { DEFAULT: '#1e1b4b', light: '#334155' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        .nav-dropdown-menu { display: none; }
        .nav-dropdown:hover .nav-dropdown-menu { display: block; }
        .modal-overlay { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); }
        .modal-enter { animation: modalEnter 0.3s ease-out; }
        @keyframes modalEnter { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-lg fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center space-x-2">
                        <img src="logo.png" alt="云上OPC" class="w-8 h-8">
                        <span class="text-xl font-bold text-secondary">云上OPC社区</span>
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-primary font-medium transition">首页</a>
                    <div class="nav-dropdown relative group">
                        <a href="services.html" class="text-primary font-medium border-b-2 border-primary flex items-center space-x-1 py-5">
                            <span>能力中心</span>
                            <i class="fas fa-chevron-down text-xs transition-transform group-hover:rotate-180"></i>
                        </a>
                        <div class="nav-dropdown-menu absolute left-0 top-full bg-white shadow-xl rounded-xl border border-gray-200 min-w-[220px] py-2 z-50">
                            <a href="services.html#ai-models" class="block px-6 py-3 text-gray-700 hover:bg-gray-50 text-sm font-medium transition">AI模型服务</a>
                            <a href="services.html#data-api" class="block px-6 py-3 text-primary bg-purple-50 text-sm font-medium transition">数据API服务</a>
                            <a href="services.html#cloud" class="block px-6 py-3 text-gray-700 hover:bg-gray-50 text-sm font-medium transition">云资源服务</a>
                        </div>
                    </div>
                    <a href="marketplace.html" class="text-gray-600 hover:text-primary font-medium transition">应用集市</a>
                    <a href="maker-space.html" class="text-gray-600 hover:text-primary font-medium transition">创客空间</a>
                    <a href="events.html" class="text-gray-600 hover:text-primary font-medium transition">社区活动</a>
                    <a href="news.html" class="text-gray-600 hover:text-primary font-medium transition">前沿资讯</a>
                    <a href="about.html" class="text-gray-600 hover:text-primary font-medium transition">关于我们</a>
                    <div id="user-section">
                        <a href="login.html" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary-dark transition">登录/注册</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="pt-24 pb-16">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="data-detail-container" class="fade-in"></div>
        </div>
    </main>

    <!-- 服务申请表单弹窗 -->
    <div id="applyModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-secondary">服务申请</h3>
                <button onclick="closeApplyModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="applyForm">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">所需数据类型</label>
                        <select id="dataApiTypeSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            <option>要素数据 - 企业工商信息查询</option>
                            <option>要素数据 - 知识产权数据</option>
                            <option>要素数据 - 企业关系图谱</option>
                            <option>场景数据 - 招商引资数据</option>
                            <option>场景数据 - 企业服务数据</option>
                            <option>场景数据 - 精准营销数据</option>
                            <option>主题数据 - 半导体产业链数据</option>
                            <option>主题数据 - 人工智能产业数据</option>
                            <option>主题数据 - 新能源产业数据</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">调用频率预估</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            <option>日均 < 1000 次</option>
                            <option>日均 1000 - 10000 次</option>
                            <option>日均 > 10000 次</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">申请备注</label>
                        <textarea id="applyNote" rows="4" placeholder="请描述您的具体需求..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex space-x-4">
                    <button type="button" onclick="submitApply()" class="flex-1 bg-primary text-white py-3 rounded-lg hover:bg-primary-dark transition">提交申请</button>
                    <button type="button" onclick="closeApplyModal()" class="flex-1 border border-gray-300 text-gray-700 py-3 rounded-lg hover:bg-gray-50 transition">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>

    function getUrlParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    function renderDataDetail() {
        const id = getUrlParam('id');
        const product = dataProducts[id];
        const container = document.getElementById('data-detail-container');
        if (!product) {
            container.innerHTML = '<div class="text-center py-20"><i class="fas fa-exclamation-circle text-4xl text-gray-300 mb-4"></i><p class="text-gray-500 text-lg">未找到该数据产品</p><a href="services.html#data-api" class="mt-4 inline-block text-primary hover:text-primary-dark font-medium">返回数据API服务</a></div>';
            return;
        }

        document.title = product.name + ' - 云上OPC社区';

        container.innerHTML =
        '<a href="services.html#data-api" class="inline-flex items-center text-gray-500 hover:text-primary mb-6 transition"><i class="fas fa-arrow-left mr-2"></i>返回数据API服务</a>' +
        '<div class="bg-white rounded-2xl p-8 shadow-lg border border-gray-100 mb-8">' +
            '<div class="flex items-start justify-between mb-6">' +
                '<div class="flex items-start gap-4">' +
                    '<div class="w-16 h-16 ' + product.iconBg + ' rounded-2xl flex items-center justify-center flex-shrink-0">' +
                        '<i class="fas ' + product.icon + ' text-2xl ' + product.iconColor + '"></i>' +
                    '</div>' +
                    '<div>' +
                        '<div class="flex items-center gap-2 mb-1">' +
                            '<span class="bg-primary/10 text-primary text-xs px-3 py-1 rounded-full font-medium">' + product.category + '</span>' +
                        '</div>' +
                        '<h1 class="text-3xl font-bold text-secondary">' + product.name + '</h1>' +
                    '</div>' +
                '</div>' +
                '<button onclick="handleApply()" class="inline-flex items-center gap-1.5 bg-primary text-white px-6 py-3 rounded-lg text-sm font-medium hover:bg-primary-dark transition shadow-sm flex-shrink-0 self-end">' +
                    '<i class="fas fa-paper-plane text-xs"></i>' +
                    '<span>立即申请</span>' +
                '</button>' +
            '</div>' +
            '<p class="text-gray-600 text-lg mb-8 leading-relaxed">' + product.description + '</p>' +
            '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">' +
                '<div class="bg-gray-50 rounded-xl p-4"><span class="text-xs text-gray-400 block mb-1">适用行业</span><span class="text-sm font-medium text-secondary">' + product.industry + '</span></div>' +
                '<div class="bg-gray-50 rounded-xl p-4"><span class="text-xs text-gray-400 block mb-1">应用场景</span><span class="text-sm font-medium text-secondary">' + product.scenario + '</span></div>' +
                '<div class="bg-gray-50 rounded-xl p-4"><span class="text-xs text-gray-400 block mb-1">更新频率</span><span class="text-sm font-medium text-secondary">' + product.updateFrequency + '</span></div>' +
            '</div>' +
            '<div class="mb-8">' +
                '<h3 class="text-lg font-bold text-secondary mb-3">核心功能</h3>' +
                '<ul class="grid grid-cols-1 md:grid-cols-2 gap-2">' +
                    product.features.map(function(f) { return '<li class="flex items-center space-x-2 text-gray-600"><i class="fas fa-check-circle text-green-500 text-sm"></i><span>' + f + '</span></li>'; }).join('') +
                '</ul>' +
            '</div>' +
            '<div class="mb-8">' +
                '<h3 class="text-lg font-bold text-secondary mb-3">数据字段</h3>' +
                '<p class="text-gray-600 text-sm bg-gray-50 rounded-xl p-4">' + product.dataFields + '</p>' +
            '</div>' +
            '<div class="mb-8">' +
                '<h3 class="text-lg font-bold text-secondary mb-3">API接口</h3>' +
                '<div class="bg-gray-900 rounded-xl p-4 font-mono text-sm">' +
                    '<span class="text-green-400">GET</span> <span class="text-white">' + product.apiEndpoint + '</span>' +
                '</div>' +
            '</div>' +
        '</div>';
    }

    function handleApply() {
        const id = getUrlParam('id');
        const product = dataProducts[id];
        if (product) {
            withAuthChain({action: product.name + '申请', callbackName: 'openDataApplyModal', args: [product.name]});
        } else {
            withAuthChain({action: '数据API申请', targetUrl: 'services.html#data-api'});
        }
    }

    function openDataApplyModal(serviceName) {
        if (serviceName) {
            var select = document.getElementById('dataApiTypeSelect');
            for (var i = 0; i < select.options.length; i++) {
                if (select.options[i].text.indexOf(serviceName) !== -1) {
                    select.selectedIndex = i;
                    break;
                }
            }
        }
        document.getElementById('applyNote').value = '';
        document.getElementById('applyModal').classList.remove('hidden');
        document.getElementById('applyModal').classList.add('flex');
    }

    function closeApplyModal() {
        document.getElementById('applyModal').classList.add('hidden');
        document.getElementById('applyModal').classList.remove('flex');
    }

    function submitApply() {
        closeApplyModal();
        showToast('申请已提交，请至个人中心查看您的服务申请进度与服务文档');
    }

    document.addEventListener('DOMContentLoaded', function() {
        renderDataDetail();
    });
    </script>
</body>
</html>
